name: LLM Guardrail Evaluation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  guardrail-policy-gate:
    name: Guardrail Policy Gate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run CI policy evaluation
        run: |
          python -m app.evaluation.ci_policy_gate